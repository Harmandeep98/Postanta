services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9 --activate &&
             pnpm install &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    env_file:
      - .env.local
    environment:
      # DATABASE_URL comes from .env.local now (points at RDS) — only Redis still
      # needs overriding to the Docker service hostname instead of localhost.
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  app_node_modules:
